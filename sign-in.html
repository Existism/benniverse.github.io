<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Page Info -->
    <title>Benniverse Wiki</title>
    <link rel="icon" href="ben.ico">

    <link rel="stylesheet" href="app.css">
    <link rel="stylesheet" href="sign-in.css">

</head>

<body>

    <main class="sign-in-container">
        <form class="sign-in-inputs">

            <input
                type="text"
                class="account-info"
                placeholder="Username/Email"
            >

            <input
                type="password"
                class="account-info"
                placeholder="Password"
            >

            <button
                type="submit"  
                class="sign-in-button" 
            >
                SIGN IN
            </button>

            <a href="https://Benniverse.org/recover">Forgot Username or Password?</a>

            <a href="https://Benniverse.org/register">Register New Account</a>

        </form>
    </main>
    
    <!-- JavaScript -->
    <script src="app.js">

    </script>

</body>
</html>
